name: memorycheck-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Lifecycle gate (reference strict must pass)
        run: memorycheck run scenarios --adapter reference:strict --fail-on p2
