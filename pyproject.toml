[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorycheck"
version = "0.1.0"
description = "Release gate for agent memory: prove your agent remembers, updates, scopes and forgets - behaviourally, not just at the storage API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
memorycheck = "memorycheck.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mem0 = ["mem0ai>=2.0.14"]
zep = ["zep-cloud>=3.25.0"]

[tool.setuptools.packages.find]
where = ["src"]
